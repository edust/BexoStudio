<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <style id="bexo-runtime-style-nonce">
      html[data-overlay="screenshot"],
      html[data-overlay="screenshot"] body,
      html[data-overlay="screenshot"] #root,
      html[data-overlay="screenshot"] .ant-app {
        background: transparent !important;
      }
    </style>
    <script id="bexo-runtime-style-bootstrap">
      (function () {
        var nonceAnchor = document.getElementById("bexo-runtime-style-nonce");
        var runtimeStyleNonce = nonceAnchor ? nonceAnchor.nonce : "";

        if (runtimeStyleNonce) {
          var createElement = document.createElement.bind(document);
          document.createElement = function (tagName, options) {
            var element = createElement(tagName, options);
            var normalizedTagName = String(tagName).toLowerCase();
            if (normalizedTagName === "style") {
              element.nonce = runtimeStyleNonce;
            }
            return element;
          };
        }

        var params = new URLSearchParams(window.location.search);
        if (params.get("overlay") === "screenshot") {
          document.documentElement.dataset.overlay = "screenshot";
        }
      })();
    </script>
    <title>Bexo Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
